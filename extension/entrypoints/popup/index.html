<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>English Wordbook</title>
    <style>
      body { width: 300px; padding: 1rem; }
    </style>
  </head>
  <body>
    <section id="login" hidden>
      <h1 id="login-title">Log in</h1>
      <form id="login-form">
        <label>Email <input name="email" type="email" autocomplete="email" required /></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" minlength="8" required /></label>
        <label id="invite-row" hidden>Invite code <input name="inviteCode" /></label>
        <div class="row">
          <button type="submit" id="login-submit">Log in</button>
          <button type="button" class="link" id="mode-toggle">Create an account</button>
        </div>
      </form>
      <p id="login-msg" class="error" role="alert"></p>
    </section>

    <section id="main" hidden>
      <h1>English Wordbook</h1>
      <form id="add-form">
        <label>Add a word <input id="word" name="word" maxlength="100" required /></label>
        <button type="submit">Save</button>
      </form>
      <p id="msg" role="status"></p>
      <div class="row">
        <button type="button" id="open-book">Open wordbook</button>
        <button type="button" class="link" id="logout">Log out</button>
      </div>
      <p class="muted">Tip: select text on a page, right-click, then "Add to wordbook".</p>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
